version: '4'
services:
  mongodb:
    image: mongo:7.0.5
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB-ROOT-USERNAME: root
      MONGO_INITDB-ROOT-PASSWORD: password
      MONGO_INITDB-ROOT-DATABASE: product-service
    volumes:
      - ./data:/data/db


